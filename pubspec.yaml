name: dio_debug_logger
description: >-
  In-app network inspector for Dio: searchable request list, request and
  response details, stats, retry, cURL export and dev/staging/prod switching.
version: 0.4.1
homepage: https://samiragaev.com
repository: https://github.com/samiraghayev12/logging
issue_tracker: https://github.com/samiraghayev12/logging/issues

topics:
  - dio
  - network
  - logging
  - debugging
  - http

screenshots:
  - description: Demo — requests, details, errors and analytics
    path: doc/demo.webp
  - description: Switch between dev, staging and prod backends at runtime
    path: doc/environment.png
  - description: Network log list
    path: test/goldens/list_phone.png
  - description: Request details
    path: test/goldens/detail_ok.png
  - description: Statistics
    path: test/goldens/stats_phone.png

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  json_view: ^0.4.2
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
